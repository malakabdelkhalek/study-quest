<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Study Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: a whiteboard (chalkboard in dark) holding sticky notes; game chrome (XP, streak, ring) rides on top. Rail nav on desktop, bottom tabs on phone. */
:root{
  --board:#f6f7f3; --grid:#e3e7ee; --frame:#b9c0ca; --ink:#1d2a44; --muted:#5d6b84;
  --blue:#2457c9; --red:#d9382f; --green:#1a8f4c; --orange:#e07a12; --purple:#7a4fd0;
  --y:#ffe97a; --p:#ffc9da; --b:#cfe6ff; --g:#cdf1c8; --paper:#ffffff; --codebg:#f2f4fa;
  --shadow:rgba(29,42,68,.18); --ok:#1a8f4c; --bad:#d9382f;
  --f-marker:"Permanent Marker","Comic Sans MS",cursive; --f-hand:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --board:#1f2c26; --grid:#2a3a33; --frame:#5a4632; --ink:#eef2e8; --muted:#a9b8ad;
  --blue:#8db6ff; --red:#ff8d84; --green:#8fe08f; --orange:#ffb25e; --purple:#c7a6ff;
  --y:#5d5524; --p:#5a3343; --b:#24405e; --g:#2b4e2f; --paper:#26342d; --codebg:#18231e;
  --shadow:rgba(0,0,0,.45); --ok:#8fe08f; --bad:#ff8d84; color-scheme:dark}}
:root[data-theme="night"]{
  --board:#17120d; --grid:#211a13; --frame:#4a3826; --ink:#ecd7b8; --muted:#a8916f;
  --blue:#a9bedf; --red:#e99a83; --green:#b5cf8f; --orange:#e6ad62; --purple:#cfaad9;
  --y:#4a3c1c; --p:#4a2a26; --b:#2a3140; --g:#2c3a22; --paper:#211a13; --codebg:#140f0a;
  --shadow:rgba(0,0,0,.55); --ok:#b5cf8f; --bad:#e99a83; color-scheme:dark}
:root[data-theme="dark"]{
  --board:#1f2c26; --grid:#2a3a33; --frame:#5a4632; --ink:#eef2e8; --muted:#a9b8ad;
  --blue:#8db6ff; --red:#ff8d84; --green:#8fe08f; --orange:#ffb25e; --purple:#c7a6ff;
  --y:#5d5524; --p:#5a3343; --b:#24405e; --g:#2b4e2f; --paper:#26342d; --codebg:#18231e;
  --shadow:rgba(0,0,0,.45); --ok:#8fe08f; --bad:#ff8d84; color-scheme:dark}
html,body{height:100%}
body{background:var(--board);color:var(--ink);font-family:var(--f-hand);font-size:18px;line-height:1.35;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--board)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px dashed var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-marker);font-weight:normal;letter-spacing:.3px;text-wrap:balance;margin:0}
code,pre{font-family:var(--f-code)}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
@media(min-width:900px){.app{grid-template-columns:210px 1fr}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--board);border-bottom:3px solid var(--frame);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-marker);font-size:22px;color:var(--blue);white-space:nowrap}
.logo span{color:var(--red)}
.chips{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-size:16px;white-space:nowrap}
.chip b{font-family:var(--f-marker);font-weight:normal}
.flame{color:var(--orange)} .flame.off{filter:grayscale(1);opacity:.6}
.xpbar{flex:1 1 160px;min-width:120px;max-width:340px;display:flex;align-items:center;gap:8px}
.lvl{font-family:var(--f-marker);background:var(--purple);color:var(--paper);border-radius:8px;padding:0 7px;font-size:15px;white-space:nowrap}
.bar{flex:1;height:12px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--purple),var(--purple) 6px,color-mix(in srgb,var(--purple) 75%,var(--paper)) 6px,color-mix(in srgb,var(--purple) 75%,var(--paper)) 12px);transition:width .6s}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:3px solid var(--frame);display:flex;justify-content:space-around;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav a{flex:1;text-align:center;padding:6px 2px 8px;color:var(--muted);text-decoration:none;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:1px}
.nav a svg{width:24px;height:24px}
.nav a.on{color:var(--blue)}
.nav a.on span{text-decoration:underline wavy var(--red) 1.5px;text-underline-offset:3px}
@media(min-width:900px){
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:3px solid var(--frame);padding:16px 10px;grid-row:1/span 2}
  .nav a{flex:0;flex-direction:row;gap:10px;font-size:19px;padding:9px 12px;border-radius:10px;justify-content:flex-start}
  .nav a.on{background:var(--b);color:var(--ink)}
  .nav .brand{display:block!important;margin:0 0 14px 8px}
}
.nav .brand{display:none}
@media(min-width:900px){.top .logo{display:none}.app{background:linear-gradient(90deg,var(--paper) 207px,var(--frame) 207px,var(--frame) 210px,transparent 210px)}}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week .wd{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:6px 2px;text-align:center;min-width:0}
.week .wd b{display:block;font-family:var(--f-marker);font-weight:normal;font-size:20px}
.week .wd span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week .wd.met{background:var(--g);border-color:var(--green)}
.week .wd.today{box-shadow:0 3px 0 var(--blue);border-color:var(--blue)}
main{padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1080px;width:100%;margin:0 auto;min-width:0}
@media(min-width:900px){main{padding-bottom:40px}}

/* board pieces */
.row{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.sticky{background:var(--y);padding:14px 16px;box-shadow:2px 4px 0 var(--shadow);border-radius:2px 2px 10px 2px;position:relative;min-width:0}
.sticky.p{background:var(--p)} .sticky.b{background:var(--b)} .sticky.g{background:var(--g)} .sticky.w{background:var(--paper)}
.sticky.tilt{transform:rotate(-.8deg)} .sticky.tilt2{transform:rotate(.7deg)}
.tape::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:color-mix(in srgb,var(--paper) 70%,transparent);border:1px solid color-mix(in srgb,var(--ink) 15%,transparent);transform:rotate(-3deg)}
.board-h{font-family:var(--f-marker);font-size:28px;margin:4px 0 12px;color:var(--ink)}
.board-h u{text-decoration:none;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--y) 90%,transparent) 62%)}
.mk-blue{color:var(--blue)} .mk-red{color:var(--red)} .mk-green{color:var(--green)} .muted{color:var(--muted)}
.small{font-size:15px}
.sec{margin:22px 0 10px;font-family:var(--f-marker);font-size:21px;color:var(--blue)}
.stack{display:flex;flex-direction:column;gap:12px}
.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* game buttons */
.btn{border:2.5px solid var(--ink);background:var(--paper);border-radius:12px;padding:8px 16px;box-shadow:0 4px 0 var(--ink);font-size:18px;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--green);color:var(--paper);border-color:var(--ink)}
.btn.blue{background:var(--blue);color:var(--paper)}
.btn.red{background:var(--red);color:var(--paper)}
.btn.big{font-family:var(--f-marker);font-size:21px;padding:10px 22px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{box-shadow:none;border-style:dashed}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0}

/* today */
.hero{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:700px){.hero{grid-template-columns:auto 1fr}}
.ringbox{display:flex;align-items:center;gap:16px}
.ring{width:132px;height:132px;flex:none}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:color-mix(in srgb,var(--ink) 12%,transparent)}
.ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .8s}
.ring text{fill:var(--ink);font-family:var(--f-marker);text-anchor:middle}
.mission h3{font-size:22px;margin-bottom:6px}
.tasks{list-style:none;padding:0;margin:8px 0 12px;display:flex;flex-direction:column;gap:6px}
.tasks li{display:flex;gap:10px;align-items:flex-start}
.box{width:22px;height:22px;border:2.5px solid var(--ink);border-radius:5px;flex:none;margin-top:2px;display:grid;place-items:center;font-family:var(--f-marker);color:var(--green);background:var(--paper)}
.tasks li.done span.t{text-decoration:line-through;text-decoration-color:var(--red);opacity:.7}
.timeline{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 10px}
.day{flex:none;width:92px;overflow-wrap:anywhere;min-height:86px;border:2px dashed var(--muted);border-radius:10px;padding:6px;font-size:14px;background:var(--paper);position:relative}
.day b{font-family:var(--f-marker);font-weight:normal;display:block;font-size:13px;color:var(--muted)}
.day.done{border-style:solid;border-color:var(--green);background:var(--g)}
.day.now{border:3px solid var(--blue);box-shadow:0 3px 0 var(--blue)}
.day.done::after{content:"✓";position:absolute;right:6px;top:2px;font-family:var(--f-marker);color:var(--green);font-size:20px}
.day.exam{border:3px solid var(--red);background:var(--p)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-marker);font-weight:normal;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.banner{border:2.5px solid var(--red);background:var(--p);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.meter{height:16px;border:2px solid var(--ink);border-radius:9px;background:var(--paper);position:relative;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);transition:width .8s}
.meter .pass{position:absolute;top:-3px;bottom:-3px;left:70%;border-left:3px dashed var(--red)}

/* learn */
.chgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.chcard{cursor:pointer;text-align:left;border:0;font:inherit}
.chcard h3{font-size:20px}
.pct{font-family:var(--f-marker);font-size:15px}
.lessonlist{display:flex;flex-direction:column;gap:8px}
.lessonlist button{text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center}
.lessonlist button .box{margin:0}
.lesson{background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:16px;box-shadow:3px 5px 0 var(--shadow);min-width:0;max-width:820px}
.lesson h2{font-size:26px;color:var(--red);margin-bottom:10px}
.lesson h3{font-size:20px;color:var(--blue);margin:14px 0 4px}
.lesson ul{padding-left:20px;margin:6px 0} .lesson li{margin:3px 0}
.lesson p{margin:6px 0}
.lesson .y{background:linear-gradient(transparent 45%,var(--y) 45%);padding:0 2px}
.lesson .r{color:var(--red);font-weight:bold} .lesson .g{color:var(--green);font-weight:bold}
.lesson .tag{font-size:13px;background:var(--purple);color:var(--paper);border-radius:4px;padding:0 5px}
.lesson .box{all:unset;display:block;margin:12px 0;padding:10px 14px;border-radius:2px 2px 10px 2px;box-shadow:2px 3px 0 var(--shadow)}
.lesson .box .t{font-family:var(--f-marker);font-size:17px;margin-bottom:3px}
.lesson .heart{background:var(--y)} .lesson .trap{background:var(--p)} .lesson .ex{background:var(--b)}
.lesson .trap .t{color:var(--red)} .lesson .ex .t{color:var(--blue)}
.tbl{overflow-x:auto;margin:8px 0}
.lesson table,.tbl table{border-collapse:collapse;font-size:16px;min-width:100%}
.lesson th{font-family:var(--f-marker);font-weight:normal;background:var(--blue);color:var(--paper);text-align:left;padding:4px 8px}
.lesson td{border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);padding:4px 8px;vertical-align:top}
code{font-size:.82em;background:var(--codebg);padding:1px 4px;border-radius:4px}
pre,.code{font-size:14px;line-height:1.45;background:var(--codebg);border-left:4px solid var(--blue);padding:10px 12px;border-radius:4px;overflow-x:auto;margin:8px 0;white-space:pre;max-width:100%}
.k{color:var(--purple);font-weight:700} .s{color:var(--green)} .n{color:var(--orange)} .cm,.c{color:var(--muted);font-style:italic}

/* quiz */
.qwrap{max-width:760px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qhead .bar{height:16px}
.qhead .bar i{background:var(--green)}
.x{border:0;background:none;font-size:26px;line-height:1;padding:2px 6px;color:var(--muted)}
.qcard{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:16px;box-shadow:0 5px 0 var(--ink);min-width:0}
.qtopic{font-size:14px;color:var(--muted);margin-bottom:4px}
.qtext{font-size:21px;margin:2px 0 6px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;border:2.5px solid var(--ink);background:var(--paper);border-radius:12px;padding:10px 14px;box-shadow:0 4px 0 var(--ink);display:flex;gap:10px;align-items:flex-start;min-width:0}
.opt .lt{font-family:var(--f-marker);color:var(--blue);flex:none;width:20px}
.opt .ov{min-width:0;overflow-x:auto}
.opt .ov.mono{font-family:var(--f-code);font-size:15px;white-space:pre}
.opt.sel{background:var(--b)}
.opt.ok{background:var(--g);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.bad{background:var(--p);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{margin-top:14px;border-radius:12px;padding:12px 14px;border:2.5px solid}
.feedback.ok{border-color:var(--ok);background:var(--g)} .feedback.bad{border-color:var(--bad);background:var(--p)}
.feedback h3{font-size:22px}
.why{margin-top:10px;background:var(--paper);border:2px dashed var(--ink);border-radius:10px;padding:8px 12px;font-size:18px;line-height:1.4}
.why b{font-family:var(--f-marker);font-weight:normal;color:var(--purple);font-size:17px}
.why p{margin:4px 0 0}
.outbox.badout{border-color:var(--bad);text-decoration:line-through;text-decoration-color:var(--bad)}
.outbox{font-family:var(--f-code);font-size:14px;white-space:pre;overflow-x:auto;background:var(--paper);border:1.5px solid var(--ok);border-radius:6px;padding:6px 8px;margin:6px 0}
.qfoot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.combo{font-family:var(--f-marker);color:var(--orange)}
.xpfloat{position:fixed;z-index:60;font-family:var(--f-marker);font-size:26px;color:var(--purple);pointer-events:none;animation:up 1s forwards}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
.nav-q{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.nav-q button{width:34px;height:34px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);font-size:14px;padding:0}
.nav-q button.ans{background:var(--b)} .nav-q button.cur{outline:3px solid var(--orange)} .nav-q button.flag{border-color:var(--red);border-width:3px}
.timer{font-family:var(--f-marker);font-variant-numeric:tabular-nums;font-size:20px}
.timer.low{color:var(--red)}
.result{text-align:center}
.bigscore{font-family:var(--f-marker);font-size:64px;line-height:1}
.selfgrade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* weak */
.heat{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cell{border:2px solid var(--ink);border-radius:10px;padding:8px 10px;text-align:left;background:var(--paper);min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.cell b{font-family:var(--f-marker);font-weight:normal;font-size:22px;font-variant-numeric:tabular-nums}
.cell.m0{background:var(--paper);border-style:dashed} .cell.m1{background:var(--p)} .cell.m2{background:color-mix(in srgb,var(--orange) 35%,var(--paper))} .cell.m3{background:var(--y)} .cell.m4{background:var(--g)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin:8px 0}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:16px;height:16px;border:2px solid var(--ink);border-radius:4px;display:inline-block}

/* me */
.badges{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.badge{text-align:center;padding:12px 8px;border:2px dashed var(--muted);border-radius:12px;background:var(--paper);opacity:.55}
.badge.got{opacity:1;border:2.5px solid var(--ink);background:var(--y);box-shadow:0 4px 0 var(--ink)}
.badge .ic{font-size:34px;line-height:1.1;filter:grayscale(1)} .badge.got .ic{filter:none}
.badge b{display:block;font-family:var(--f-marker);font-weight:normal;font-size:15px}
.badge small{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field input,.field select{font:inherit;padding:6px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink);max-width:260px}
.toggle{display:flex;gap:8px;align-items:center}

/* lab */
.lab{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:900px){.lab{grid-template-columns:1fr 1fr}}
textarea.ed{width:100%;min-height:260px;font-family:var(--f-code);font-size:14px;line-height:1.45;background:var(--codebg);color:var(--ink);border:2.5px solid var(--ink);border-radius:10px;padding:10px;resize:vertical;tab-size:4}
.console{min-height:260px;font-family:var(--f-code);font-size:14px;white-space:pre-wrap;word-break:break-word;background:var(--ink);color:var(--board);border-radius:10px;padding:10px;overflow:auto;max-height:60vh}
.console .err{color:var(--p)}

/* modal + toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--board);padding:8px 16px;border-radius:12px;font-size:17px;max-width:90vw;box-shadow:0 4px 0 var(--shadow)}
@media(min-width:900px){.toast{bottom:24px}}
.modal{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:16px}
.modal .sticky{max-width:420px;width:100%;text-align:center}
.lvlup{font-family:var(--f-marker);font-size:40px;color:var(--purple)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.thbtn{cursor:pointer;font-size:17px;padding:2px 9px}
.thmenu{position:fixed;z-index:75;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:6px;display:flex;flex-direction:column;gap:4px;width:min(290px,calc(100vw - 24px))}

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script>
"use strict";
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayStr = (d = new Date()) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 10); };
const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return dayStr(d); };
const diffDays = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 864e5);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtDay = s => parseDay(s).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const KW = "def|class|return|if|elif|else|for|while|in|not|and|or|is|import|from|as|try|except|finally|raise|assert|with|yield|lambda|pass|break|continue|global|nonlocal|None|True|False|del|match|case|print|super|self";
const TOK = new RegExp(`(#[^\\n]*)|("""[\\s\\S]*?"""|'''[\\s\\S]*?'''|"(?:\\\\.|[^"\\\\\\n])*"|'(?:\\\\.|[^'\\\\\\n])*')|\\b(${KW})\\b|\\b(\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)\\b`, "g");
function hl(code) {
  let out = "", last = 0, m; TOK.lastIndex = 0;
  while ((m = TOK.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : "n";
    out += `<span class="${cls}">${esc(m[0])}</span>`; last = TOK.lastIndex;
  }
  return out + esc(code.slice(last));
}
// "!Err" = raises; "a\n!Err" = prints then raises
function fmtOut(o) {
  if (o == null) return "";
  if (o.startsWith("!")) return "→ raises " + o.slice(1);
  const i = o.indexOf("\n!"); if (i >= 0) return o.slice(0, i) + "\n→ then raises " + o.slice(i + 2);
  return o;
}

/* ================= state ================= */
const LS = "studyquest.v1";
const LSS = "studyquest.subject"; // last active subject id
const TODAY = () => dayStr();
function fresh() {
  return { v: 1, upd: 0, resetAt: 0, xp: 0, startDate: TODAY(), examDate: "", goalMin: 15, sound: true, bonus: true,
    days: {}, qs: {}, topics: {}, lessons: {}, boards: {}, voice: true, tasks: {}, mocks: [], badges: {}, bestStreak: 0, totalOk: 0, totalN: 0 };
}
// per-subject state lives under S.sub[subjectId]
function freshSub() {
  return { xp: 0, startDate: TODAY(), examDate: "", days: {}, qs: {}, topics: {}, lessons: {}, boards: {}, tasks: {}, mocks: [], totalOk: 0, totalN: 0 };
}
let S = fresh();
try { const raw = localStorage.getItem(LS); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
S.sub = S.sub || {};
let C = null; // content for current subject
let SUBJ = null; // current subject meta object
let SUBJECTS = []; // all subjects from subjects.json
let activeSubjectId = null;
const T = () => {
  const bucket = activeSubjectId ? (S.sub[activeSubjectId] ||= freshSub()) : S;
  return (bucket.days[TODAY()] ||= { sec: 0, q: 0, ok: 0, quiz: 0, pass: 0 });
};

/* --- sync with db (per-person private doc) --- */
let db = null, docRef = null, syncState = "local", writing = false, dirty = false, lastWrite = 0, saveTimer = null;
function merge(a, b) { // union of two progress states, never loses work (a reset always wins)
  if ((a.resetAt || 0) !== (b.resetAt || 0)) return Object.assign(fresh(), (a.resetAt || 0) > (b.resetAt || 0) ? a : b);
  const m = Object.assign(fresh(), a);
  m.xp = Math.max(a.xp || 0, b.xp || 0);
  m.bestStreak = Math.max(a.bestStreak || 0, b.bestStreak || 0);
  m.totalOk = Math.max(a.totalOk || 0, b.totalOk || 0); m.totalN = Math.max(a.totalN || 0, b.totalN || 0);
  for (const k of ["examDate", "goalMin", "sound", "bonus", "startDate", "voice"]) m[k] = (b.upd || 0) > (a.upd || 0) ? b[k] : a[k];
  m.days = { ...a.days }; for (const [d, v] of Object.entries(b.days || {})) { const o = m.days[d] || {}; m.days[d] = { sec: Math.max(o.sec || 0, v.sec || 0), q: Math.max(o.q || 0, v.q || 0), ok: Math.max(o.ok || 0, v.ok || 0), quiz: Math.max(o.quiz || 0, v.quiz || 0), pass: Math.max(o.pass || 0, v.pass || 0), night: o.night || v.night }; }
  m.qs = { ...a.qs }; for (const [k, v] of Object.entries(b.qs || {})) if (!m.qs[k] || (v.n || 0) > (m.qs[k].n || 0)) m.qs[k] = v;
  m.topics = { ...a.topics }; for (const [k, v] of Object.entries(b.topics || {})) if (!m.topics[k] || (v.n || 0) > (m.topics[k].n || 0)) m.topics[k] = v;
  for (const k of ["lessons", "boards", "tasks", "badges"]) m[k] = { ...(b[k] || {}), ...(a[k] || {}) };
  const seen = new Set(); m.mocks = [...(a.mocks || []), ...(b.mocks || [])].filter(x => !seen.has(x.at) && seen.add(x.at)).sort((x, y) => x.at - y.at);
  m.upd = Math.max(a.upd || 0, b.upd || 0);
  return m;
}
function save(important) {
  S.upd = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  dirty = true; clearTimeout(saveTimer);
  const wait = important ? 800 : Math.max(2500, 20000 - (Date.now() - lastWrite));
  saveTimer = setTimeout(flush, wait);
}
async function flush() {
  if (!docRef || !dirty) return;
  if (writing) { saveTimer = setTimeout(flush, 1500); return; }
  writing = true; dirty = false; lastWrite = Date.now();
  try { await docRef.set({ state: JSON.stringify(S), upd: S.upd }); syncState = "synced"; }
  catch (e) { syncState = "local"; dirty = true; }
  writing = false;
}
(async () => {
  try {
    if (!window.claude?.use) return;
    const [dbx, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!dbx || !user) return;
    const id = await user.id(); if (!id) return;
    db = dbx; docRef = db.doc("data/users/" + id + "/progress");
    let first = true;
    docRef.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      syncState = "synced";
      if (snap.exists) {
        let remote; try { remote = JSON.parse(snap.data().state); } catch (e) { return; }
        if ((remote.upd || 0) !== (S.upd || 0)) { S = merge(S, remote); try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} refreshChrome(); if (first && !quiz) render(); }
        if (first && (S.upd || 0) > (remote.upd || 0)) { dirty = true; flush(); }
      } else if (first) { dirty = true; flush(); }
      first = false;
      if (route === "me") render();
    }, () => { syncState = "local"; });
  } catch (e) {}
})();

/* ================= gamification ================= */
const LEVELS = ["Hello World", "Variable Voyager", "Loop Rider", "String Slinger", "Exception Handler", "Class Act", "Generator Wizard", "Closure Keeper", "MRO Master", "Quest Legend", "Study Ace"];
function need(n) { return 60 * n * (n + 1); }
function levelInfo() { let n = 0; while (S.xp >= need(n + 1)) n++; const a = need(n), b = need(n + 1); return { n, title: LEVELS[Math.min(n, LEVELS.length - 1)], pct: (S.xp - a) / (b - a) * 100, toNext: b - S.xp }; }
function addXP(n, ev) {
  const before = levelInfo().n; S.xp += n;
  if (ev && n > 0) { const f = document.createElement("div"); f.className = "xpfloat"; f.textContent = "+" + n + " XP"; const r = ev.getBoundingClientRect ? ev.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2 }; f.style.left = Math.min(innerWidth - 120, r.left + 10) + "px"; f.style.top = (r.top - 10) + "px"; document.body.appendChild(f); setTimeout(() => f.remove(), 1000); }
  const after = levelInfo().n;
  if (after > before) { sfx("level"); boom(); modal(`<div class="lvlup">Level ${after + 1}!</div><p style="font-size:22px">You are now a <b>${esc(levelInfo().title)}</b>.</p>`); }
  refreshChrome();
}
// goalMet / streak use global S.days (shared across subjects)
function goalMet(d) { return d && ((d.sec || 0) >= S.goalMin * 60 || (d.pass || 0) >= 1); }
function streak() {
  let n = 0, d = TODAY();
  if (!goalMet(S.days[d])) d = addDays(d, -1);
  while (goalMet(S.days[d])) { n++; d = addDays(d, -1); }
  return n;
}
// sub() returns the per-subject bucket (or global S if no subject loaded)
function bucket() { return activeSubjectId ? (S.sub[activeSubjectId] ||= freshSub()) : S; }
// examDate / startDate come from the subject bucket
function examDate() { return bucket().examDate || SUBJ?.examDate || ""; }
function startDate() { return bucket().startDate || TODAY(); }
function checkGoal() {
  const t = T();
  if (goalMet(t) && !t.goalAwarded) { t.goalAwarded = 1; addXP(50); sfx("level"); boom(); toast("🎯 Daily goal done! +50 XP · streak " + streak()); }
  S.bestStreak = Math.max(S.bestStreak || 0, streak());
}
const BADGES = [
  ["first", "✏️", "First Steps", "Finish your first quiz"],
  ["s3", "🔥", "On Fire", "3-day streak"],
  ["s7", "🚀", "Unstoppable", "7-day streak"],
  ["s14", "👑", "Two-Week Hero", "14-day streak"],
  ["perfect", "💯", "Flawless", "100% on a quiz of 10+"],
  ["century", "🎯", "Century", "100 correct answers"],
  ["fivehundred", "🏹", "Sharpshooter", "500 correct answers"],
  ["oop", "🧱", "Class Act", "OOP mastery 80%+"],
  ["mock", "🎓", "Exam Ready", "Pass a mock exam (70%+)"],
  ["mock85", "🏆", "Ace", "85%+ on a mock exam"],
  ["lessons", "📚", "Bookworm", "Read every lesson in chapters 1–5"],
  ["night", "🦉", "Night Owl", "Study after 22:00"],
  ["comeback", "💪", "Comeback", "Lift a weak topic to 80%+"],
  ["coder", "🐍", "Pythonista", "Run 10 programs in the Code lab"],
];
function award(id) {
  if (S.badges[id]) return; S.badges[id] = TODAY(); const b = BADGES.find(x => x[0] === id);
  sfx("level"); boom(); setTimeout(() => modal(`<div style="font-size:56px">${b[1]}</div><div class="lvlup" style="font-size:30px">${esc(b[2])}</div><p>${esc(b[3])}</p>`), 400); addXP(40);
}
function checkBadges() {
  const st = streak();
  if (st >= 3) award("s3"); if (st >= 7) award("s7"); if (st >= 14) award("s14");
  if (S.totalOk >= 100) award("century"); if (S.totalOk >= 500) award("fivehundred");
  const oop = chapterMastery("oop"); if (oop.n >= 25 && oop.m >= .8) award("oop");
  if (C && C.chapters.slice(0, 5).every(ch => ch.lessons.every((l, i) => bucket().lessons[ch.id + ":" + i]))) award("lessons");
}

/* sounds (WebAudio, after a tap) */
let AC = null;
function sfx(kind) {
  if (!S.sound) return;
  try {
    AC ||= new (window.AudioContext || window.webkitAudioContext)();
    const notes = { ok: [660, 880], bad: [220, 160], level: [523, 659, 784, 1047], tick: [900] }[kind] || [440];
    notes.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = kind === "bad" ? "sawtooth" : "triangle"; o.frequency.value = f; const t0 = AC.currentTime + i * 0.09; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(kind === "bad" ? 0.06 : 0.12, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + 0.2); });
  } catch (e) {}
}
function boom(power = 1) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || typeof confetti !== "function") return;
  const css = getComputedStyle(document.documentElement);
  const colors = ["--red", "--blue", "--green", "--orange", "--purple"].map(v => css.getPropertyValue(v).trim());
  confetti({ particleCount: 90 * power, spread: 75, origin: { y: .7 }, colors });
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const celebQ = [];
function modal(html, buttons) { // celebrations queue up one at a time; dialogs show at once
  if (!buttons && $("#layer .modal")) { celebQ.push(html); return null; }
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="sticky tape tilt">${html}<div class="flex" style="justify-content:center;margin-top:12px">${buttons || '<button class="btn go big" data-close>Nice!</button>'}</div></div>`;
  const close = () => { m.remove(); if (celebQ.length && !$("#layer .modal")) modal(celebQ.shift()); };
  m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-close]")) close(); });
  const obs = new MutationObserver(() => { if (!m.isConnected) { obs.disconnect(); if (celebQ.length && !$("#layer .modal")) modal(celebQ.shift()); } });
  $("#layer").appendChild(m); obs.observe($("#layer"), { childList: true }); return m;
}

/* ================= mastery & SRS ================= */
function record(item, ok) {
  const id = item.id, t = item.t, d = T();
  const bk = bucket();
  const q = bk.qs[id] ||= { n: 0, ok: 0, box: 0, due: "" };
  q.n++; if (ok) { q.ok++; q.box = Math.min(5, q.box + 1); } else q.box = 0;
  q.due = addDays(TODAY(), [0, 1, 2, 4, 7, 14][q.box]); q.last = ok ? 1 : 0;
  const tp = bk.topics[t] ||= { n: 0, h: [] };
  const before = mastery(t);
  tp.n++; tp.h.push(ok ? 1 : 0); if (tp.h.length > 12) tp.h.shift();

// Which chapter a topic belongs to. PCAP topics start with their chapter id ("oop.mro");
// other subjects (Django: "dj.views" in chapter "ch2") are mapped from where the topic is used.
function topicChapter(t) {

  if (!C._tch) {
    const cnt = {};
    const add = (topic, ch) => { if (!topic || !ids.includes(ch)) return; (cnt[topic] ||= {})[ch] = (cnt[topic][ch] || 0) + 1; };
    C.chapters.forEach(c => c.lessons.forEach(l => add(l.t, c.id)));
    (C.boards || []).forEach(b => add(b.t, b.ch));
    (C.cards || []).forEach(c => add(c.t, c.src));
    C._tch = Object.fromEntries(Object.entries(cnt).map(([k, v]) => [k, Object.entries(v).sort((a, b) => b[1] - a[1])[0][0]]));

}
// Which chapter a flashcard belongs to ("nb4" = PCAP notebook 4, "ch2" = chapter ch2).
function cardChapter(c) {

  if (extra && extra.h.length) { const m = mastery(ch); const wi = Math.min(m.n, 6); w += wi; s += m.m * wi; n += m.n; }

}
function subjectProgress(sid) {

}
function subjectMastery(sid) {

function pool(pick) {

let labReturn = null, pyReady = null;
const PYRUNNER = `
from browser import window
import sys
class Out:
    def write(self, t):
        window.pyout_(t)
    def flush(self):
        pass
def run(src):
    sys.stdout = Out()
    sys.stderr = Out()
    g = {'__name__': '__main__'}
    try:
        exec(src, g)
    except BaseException as e:
        window.pyerr_(type(e).__name__, str(e))
window.pyrun_ = run
window.pyready_()
`;
function loadPy() { // Brython: Python 3 in the browser, loaded only when the lab is first used
  if (pyReady) return pyReady;
  const add = src => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  pyReady = add("https://cdn.jsdelivr.net/npm/brython@3.13.2/brython.min.js")
    .then(() => add("https://cdn.jsdelivr.net/npm/brython@3.13.2/brython_stdlib.js"))
    .then(() => new Promise((res, rej) => {
      window.pyready_ = res;
      const s = document.createElement("script"); s.type = "text/python"; s.id = "pyrunner"; s.textContent = PYRUNNER; document.body.appendChild(s);
      try { brython({ debug: 0, indexedDB: false, ids: ["pyrunner"] }); } catch (e) { rej(e); }
      setTimeout(() => rej(new Error("timeout")), 20000);
    }));
  pyReady.catch(() => { pyReady = null; });
  return pyReady;
}
function vLab(m) {
  m.innerHTML = `${labReturn ? `<button class="link" data-backq>← back to my quiz</button>` : ""}<h1 class="board-h"><u>Code lab</u></h1>
  <p class="small muted">Python runs right here in your browser, so you can test traps yourself. It's a browser version of Python: about 90% of the course behaves exactly like the real thing, but files, <code>os</code>, your own modules and a few edge cases don't. If the lab and a quiz answer disagree, trust the quiz: every quiz answer was checked with real Python.</p>
  <div class="lab"><div style="min-width:0"><textarea class="ed" id="ed" spellcheck="false" aria-label="Python code">${esc(labCode)}</textarea>
  <div class="flex" style="margin-top:8px"><button class="btn go big" id="run">▶ Run</button><button class="btn ghost" id="clr">Clear output</button>
  <select id="ex" class="btn ghost" aria-label="Load an example"><option value="">Load an example…</option><option value="mro">MRO diamond</option><option value="gen">Generator</option><option value="exc">except order</option><option value="cls">class vs instance var</option><option value="str">string methods</option></select></div></div>
  <div class="console" id="out" aria-live="polite">Output appears here.</div></div>`;
  const ed = $("#ed"), out = $("#out");
  ed.addEventListener("keydown", e => { if (e.key === "Tab") { e.preventDefault(); const s = ed.selectionStart; ed.setRangeText("    ", s, ed.selectionEnd, "end"); } if ((e.ctrlKey || e.metaKey) && e.key === "Enter") $("#run").click(); });
  ed.addEventListener("input", () => { labCode = ed.value; });
  const EX = {
    mro: "class A:\n    def who(self): return 'A'\nclass B(A):\n    def who(self): return 'B'\nclass C(A):\n    def who(self): return 'C'\nclass D(B, C):\n    pass\nprint(D().who())\nprint([k.__name__ for k in D.__mro__])",
    gen: "def countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\ng = countdown(3)\nprint(list(g))\nprint(list(g))  # used up!",
    exc: "try:\n    print(1 / 0)\nexcept ArithmeticError:\n    print('arith')\nexcept ZeroDivisionError:\n    print('zero')",
    cls: "class C:\n    n = 1\na = C(); b = C()\na.n = 5\nC.n = 7\nprint(a.n, b.n, C.n)\nprint(a.__dict__)",
    str: "s = 'Where are the snows of yesteryear?'\nprint(sorted(s.split())[1])\nprint(s.find('the'), s.rfind('e'))\nprint('-'.join('abc'), 'abc'.center(7, '*'))",
  };
  $("#ex").onchange = e => { if (EX[e.target.value]) { ed.value = labCode = EX[e.target.value]; } e.target.value = ""; };
  $("#clr").onclick = () => { out.textContent = ""; };
  const bq = m.querySelector("[data-backq]"); if (bq) bq.onclick = () => { quiz = labReturn; labReturn = null; route = "practice"; render(); };
  $("#run").onclick = async () => {
    const btn = $("#run"); btn.disabled = true;
    if (!pyReady) out.textContent = "Starting Python (first run downloads about 5 MB)…";
    try { await loadPy(); } catch (e) { out.innerHTML = `<span class="err">Couldn't start Python. Check your connection and press Run again.</span>`; btn.disabled = false; return; }
    if (/while\s+True\s*:/.test(ed.value) && !/break|return|raise/.test(ed.value)) { out.innerHTML = `<span class="err">That <code>while True:</code> loop never stops, so it would freeze the page. Add a break first.</span>`; btn.disabled = false; return; }
    let buf = ""; out.textContent = "";
    window.pyout_ = t => { buf += t; out.textContent = buf; };
    window.pyerr_ = (name, msg) => { const span = document.createElement("span"); span.className = "err"; span.textContent = (buf && !buf.endsWith("\n") ? "\n" : "") + "→ raises " + name + (msg ? ": " + msg : ""); out.appendChild(span); };
    setTimeout(() => {
      try { window.pyrun_(ed.value); if (!out.textContent) out.textContent = "(no output)"; }
      catch (e) { window.pyerr_("Error", String(e.message || e)); }
      btn.disabled = false;
      S.labRuns = (S.labRuns || 0) + 1; if (S.labRuns >= 10) award("coder"); save();
    }, 30);
  };
}

  <div class="sec">Settings</div><div class="sticky w" style="max-width:560px">

   <label class="toggle" style="margin-top:6px"><span>Theme:</span><select id="th">${THEMES.map(([v, ic, name]) => `<option value="${v}" ${v === themePref ? "selected" : ""}>${ic} ${name}</option>`).join("")}</select></label>
   <p class="small muted" style="margin-top:10px">${syncState === "synced" ? "☁️ Progress syncs between your phone and laptop." : "💾 Progress is saved on this device. Sync available when signed in."}</p>
   <button class="btn red ghost" id="reset" style="margin-top:6px">Reset all progress</button></div>`;
  $("#ed1").onchange = e => { if (e.target.value) { bucket().examDate = e.target.value; if (SUBJ) SUBJ.examDate = e.target.value; save(true); refreshChrome(); toast("Exam date saved."); } };
  $("#gm").onchange = e => { S.goalMin = +e.target.value; save(true); };
  $("#snd").onchange = e => { S.sound = e.target.checked; save(true); };
  $("#bon").onchange = e => { S.bonus = e.target.checked; save(true); };
  $("#th").onchange = e => setTheme(e.target.value);
  $("#reset").onclick = () => { const mm = modal(`<h2>Reset everything?</h2><p>XP, streak, badges and all answers will be erased on every device.</p>`, `<button class="btn" data-close>Cancel</button><button class="btn red" data-really>Erase</button>`); mm.querySelector("[data-really]").onclick = () => { mm.remove(); const keep = { goalMin: S.goalMin }; S = Object.assign(fresh(), keep, { upd: Date.now(), resetAt: Date.now() }); save(true); render(); toast("Fresh start!"); }; };
}

/* ================= study-time tracking ================= */
let lastAct = Date.now();
["pointerdown", "keydown", "scroll", "touchstart"].forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
let tickN = 0;
setInterval(() => {
  const studying = quiz || route === "lab" || (route === "learn" && sub && (sub.lesson != null || sub.board));
  if (document.visibilityState !== "visible" || !studying || Date.now() - lastAct > 90e3) return;
  T().sec = (T().sec || 0) + 5; tickN++;
  const before = T().goalAwarded; checkGoal();
  if (tickN % 6 === 0 || (!before && T().goalAwarded)) { save(); if (!quiz) refreshChrome(); }
}, 5000);
addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });

/* ================= boot ================= */
/* themes: auto (device by day, night 21:00–07:00) · light · dark · night */
const THEMES = [["auto", "🌗", "Auto", "Your phone's setting by day, Night from 9pm to 7am"], ["light", "☀️", "White", "Whiteboard"], ["dark", "🌙", "Dark", "Chalkboard"], ["night", "🌃", "Night", "Warm and dim, easy on the eyes"]];
let themePref = "auto";
try { themePref = localStorage.getItem("studyquest.theme") || "auto"; } catch (e) {}
if (themePref === "") themePref = "auto";
function applyTheme() {
  const h = new Date().getHours(), root = document.documentElement;
  let t = themePref === "auto" ? (h >= 21 || h < 7 ? "night" : null) : themePref;
  if (t) root.dataset.theme = t; else delete root.dataset.theme;
  const btn = $("#thbtn"); if (btn) btn.textContent = (THEMES.find(x => x[0] === themePref) || THEMES[0])[1];
}
function setTheme(v) { themePref = v; try { localStorage.setItem("studyquest.theme", v); } catch (e) {} applyTheme(); }
applyTheme(); setInterval(applyTheme, 60e3);
$("#thbtn").onclick = e => {
  e.stopPropagation(); const old = $(".thmenu"); if (old) return old.remove();
  const r = e.currentTarget.getBoundingClientRect(), m = document.createElement("div"); m.className = "thmenu";
  m.style.top = (r.bottom + 8) + "px"; m.style.right = Math.max(12, innerWidth - r.right) + "px";
  m.innerHTML = THEMES.map(([v, ic, name, sub2]) => `<button data-th="${v}" class="${v === themePref ? "on" : ""}"><span class="ic">${ic}</span><span><b>${name}</b><br><small>${sub2}</small></span></button>`).join("");
  m.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { setTheme(b.dataset.th); m.remove(); toast((THEMES.find(x => x[0] === b.dataset.th))[2] + " mode on"); if (route === "me") render(); });
  document.body.appendChild(m);
  setTimeout(() => addEventListener("click", function off(ev) { if (!m.contains(ev.target)) { m.remove(); removeEventListener("click", off); } }), 0);
};
{ const r = location.hash.slice(1); if (TABS.some(t => t[0] === r)) route = r; }
